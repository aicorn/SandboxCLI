name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    runs-on: self-hosted
    permissions:
      contents: read

    env:
      SOCKS5_PROXY: "socks5://${{ secrets.S5_USERNAME }}:${{ secrets.S5_PASSWORD }}@${{ secrets.S5_HOST }}:${{ secrets.S5_PORT }}"
      ALL_PROXY: "socks5://${{ secrets.S5_USERNAME }}:${{ secrets.S5_PASSWORD }}@${{ secrets.S5_HOST }}:${{ secrets.S5_PORT }}"
      HTTP_PROXY: "socks5://${{ secrets.S5_USERNAME }}:${{ secrets.S5_PASSWORD }}@${{ secrets.S5_HOST }}:${{ secrets.S5_PORT }}"
      HTTPS_PROXY: "socks5://${{ secrets.S5_USERNAME }}:${{ secrets.S5_PASSWORD }}@${{ secrets.S5_HOST }}:${{ secrets.S5_PORT }}"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short
