name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        env:
          ALL_PROXY: "socks5://${{ secrets.S5_USERNAME }}:${{ secrets.S5_PASSWORD }}@${{ secrets.S5_HOST }}:${{ secrets.S5_PORT }}"
          PIP_PROXY: "socks5://${{ secrets.S5_USERNAME }}:${{ secrets.S5_PASSWORD }}@${{ secrets.S5_HOST }}:${{ secrets.S5_PORT }}"
        run: |
          python -m pip install --upgrade pip --proxy "$PIP_PROXY"
          pip install -r requirements-dev.txt --proxy "$PIP_PROXY"
          pip install -e . --proxy "$PIP_PROXY"

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short
